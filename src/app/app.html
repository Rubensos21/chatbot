<!-- El div principal aplica la clase 'dark' condicionalmente -->
<div [class.dark]="isDarkMode()" class="h-screen w-full">
  <!-- Contenedor principal con transición de colores suave -->
  <div class="flex flex-col h-full bg-slate-50 dark:bg-[#0a0c10] text-slate-800 dark:text-slate-300 font-sans transition-colors duration-300 overflow-hidden relative">
    <div *ngIf="isDarkMode()" class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-800/10 via-transparent to-transparent pointer-events-none"></div>
    <header class="h-16 flex items-center justify-between px-6 gap-4 z-10 w-full shrink-0 mt-2">
      <div class="flex items-center gap-2.5 cursor-default">
        <span class="font-bold text-xl tracking-wide text-slate-800 dark:text-white">Rubmini GPT</span>
      </div>

      <!-- Contenedor Derecho (Botones y Perfil) -->
      <div class="flex items-center gap-4">
        <!-- Toggle Claro / Oscuro -->
        <div class="flex items-center bg-slate-200 dark:bg-[#12161f] border border-slate-300 dark:border-white/5 rounded-full p-1 shadow-sm transition-colors">
          <button 
            (click)="isDarkMode.set(false)" 
            class="p-1.5 rounded-full transition-colors"
            [ngClass]="!isDarkMode() ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-400'">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
          </button>
          <button 
            (click)="isDarkMode.set(true)" 
            class="p-1.5 rounded-full transition-colors"
            [ngClass]="isDarkMode() ? 'bg-cyan-900/40 text-cyan-400 shadow-[inset_0_1px_4px_rgba(0,0,0,0.5)]' : 'text-slate-500 hover:text-slate-600'">
            <svg class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
          </button>
        </div>

        <!-- Perfil de Usuario -->
        <div class="flex items-center gap-2.5 bg-slate-200 dark:bg-[#12161f] border border-slate-300 dark:border-white/5 rounded-full pl-1.5 pr-3 py-1 shadow-sm cursor-pointer hover:bg-slate-300 dark:hover:bg-white/5 transition-colors">
          <div class="w-7 h-7 rounded-full bg-gradient-to-br from-slate-600 to-slate-800 flex items-center justify-center text-xs font-bold text-white shadow-inner border border-white/10">RS</div>
          <span class="text-[13px] font-medium text-slate-700 dark:text-slate-200 leading-tight">Rubén Sosa</span>
        </div>
      </div>
    </header>

<!-- conversación -->
    <main #scrollMe class="flex-1 overflow-y-auto w-full scroll-smooth custom-scrollbar z-10">
      
      <!-- Pantalla de bienvenida / Empty State -->
      <div *ngIf="messages().length === 0" class="h-full flex flex-col items-center justify-center text-center space-y-6 pb-20 animate-fade-in">
        <div class="relative w-28 h-28 rounded-full bg-gradient-to-b from-slate-300 dark:from-[#2a3854] to-slate-100 dark:to-[#0a0f18] flex items-center justify-center shadow-xl dark:shadow-[0_0_50px_rgba(56,189,248,0.15)] border border-slate-200 dark:border-white/5">
          <div class="absolute inset-2 rounded-full border border-slate-300 dark:border-cyan-500/20 bg-white dark:bg-[#121825] overflow-hidden">
            <svg class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-20 h-20 text-slate-800 dark:text-cyan-400 dark:drop-shadow-[0_0_8px_rgba(34,211,238,0.8)]" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
              <path d="M10 50 Q 30 10, 50 50 T 90 50" />
            </svg>
          </div>
        </div>

        <div class="space-y-2">
          <h1 class="text-3xl font-semibold text-slate-800 dark:text-white tracking-tight">Holi crayoli Rubs</h1>
          <p class="text-slate-500 dark:text-slate-400 text-[15px]">Preguntameee caon</p>
        </div>
      </div>

      <!-- Lista de mensajes -->
      <div *ngIf="messages().length > 0" class="px-6 md:px-12 max-w-3xl w-full mx-auto space-y-6 mb-6 pt-6">
        <div *ngFor="let msg of messages()" class="flex gap-4 group" [ngClass]="{'flex-row-reverse': msg.role === 'user'}">
          <div class="w-8 h-8 shrink-0 rounded-full flex items-center justify-center mt-1 border"
               [ngClass]="msg.role === 'user' ? 'bg-slate-700 border-slate-600 text-white' : 'bg-white dark:bg-[#121825] border-slate-300 dark:border-cyan-900/50 text-slate-800 dark:text-cyan-400'">
            <span *ngIf="msg.role === 'user'" class="text-xs font-bold">RS</span>
            <span *ngIf="msg.role === 'assistant'" class="text-lg">✦</span>
          </div>

          <div class="max-w-[85%] px-5 py-3.5 rounded-2xl text-[15px] leading-relaxed shadow-sm" 
               [ngClass]="{
                 'bg-slate-800 dark:bg-[#1e293b] text-white dark:text-slate-100 rounded-tr-sm': msg.role === 'user',
                 'bg-transparent text-slate-700 dark:text-slate-300': msg.role === 'assistant'
               }">
            <p class="whitespace-pre-wrap break-words">{{ msg.content }}</p>
          </div>
        </div>
        
        <div *ngIf="isLoading()" class="flex gap-4 items-center text-slate-500 animate-pulse pb-4">
          <div class="w-8 h-8 rounded-full bg-white dark:bg-[#121825] border border-slate-300 dark:border-cyan-900/50 flex items-center justify-center text-slate-800 dark:text-cyan-400 text-lg">✦</div>
          <div class="text-sm">Generando respuesta...</div>
        </div>
      </div>
    </main>

    <!-- Caja de entrada de texto -->
    <div class="px-6 pb-12 pt-2 w-full max-w-3xl mx-auto relative z-20">
      <div class="bg-white dark:bg-[#121620] border border-slate-300 dark:border-slate-700/60 rounded-2xl p-3 shadow-[0_10px_40px_rgba(0,0,0,0.1)] dark:shadow-[0_10px_40px_rgba(0,0,0,0.5)] focus-within:border-cyan-500 dark:focus-within:border-cyan-800/50 transition-colors">
        
        <textarea 
          [(ngModel)]="userInput" 
          (keydown.enter)="$event.preventDefault(); send()"
          rows="1" 
          placeholder="Escribe tu mensaje o instrucción al agente..." 
          class="w-full bg-transparent border-none outline-none text-[15px] text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 resize-none px-2 py-2 max-h-32">
        </textarea>
        
        <div class="flex items-center justify-between mt-3 px-1">
          <!-- Selector de modelo -->
          <div class="flex items-center gap-2 px-3 py-1.5 bg-slate-100 dark:bg-[#1c222f] border border-slate-200 dark:border-transparent rounded-lg text-[13px] text-slate-700 dark:text-slate-300 font-medium">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
            n8n Agent (Claude)
          </div>

          <!-- Botón Generar -->
          <button 
            (click)="send()" 
            [disabled]="isLoading() || !userInput().trim()"
            class="px-5 py-2 bg-[#3b82f6] hover:bg-[#2563eb] dark:bg-gradient-to-r dark:from-cyan-400 dark:to-blue-500 dark:hover:from-cyan-300 dark:hover:to-blue-400 disabled:opacity-50 text-white font-semibold text-[13px] rounded-lg flex items-center gap-2 transition-all shadow-md dark:shadow-[0_0_15px_rgba(56,189,248,0.4)]"
            Generar
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
